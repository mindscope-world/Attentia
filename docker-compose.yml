name: attentia

x-backend-env: &backend-env
  ENV: ${ENV:-development}
  DATABASE_URL: postgresql+asyncpg://attentia:${POSTGRES_PASSWORD:-attentia}@postgres:5432/attentia
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-in-production}
  S3_ENDPOINT_URL: http://objectstore:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:29000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-attentia}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-attentia-secret}
  S3_BUCKET: attentia-media
  ADDRESS_DERIVATION_SECRET: ${ADDRESS_DERIVATION_SECRET:-dev-address-secret}
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'

x-backend: &backend
  build: ./backend
  image: attentia-api:latest
  environment: *backend-env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    objectstore: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: attentia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attentia}
      POSTGRES_DB: attentia
    ports: ["25432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attentia -d attentia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["26379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for local development (use AWS S3 / R2 / GCS in the cloud).
  objectstore:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports: ["29000:9000"]
    volumes:
      - objectdata:/data
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1"]
      interval: 5s
      retries: 20

  # One-shot: apply migrations and seed development data.
  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "alembic upgrade head && python -m app.seed"

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      retries: 5

  worker:
    <<: *backend
    command: celery -A app.core.celery_app worker -Q default,media -l info --concurrency 2
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: celery -A app.core.celery_app beat -l info -s /tmp/celerybeat-schedule
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: .
    image: attentia-web:latest
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  objectdata:
